name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        # Dependabot-bumpable tag (YYYY.M.D.run) for gitops pins.
        run: echo "tag=$(date -u +%Y.%-m.%-d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/grafana-screenshot:latest
            ghcr.io/${{ github.repository_owner }}/grafana-screenshot:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/grafana-screenshot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
